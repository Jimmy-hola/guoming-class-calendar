<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國三班行事曆 Prototype</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
  :root {
    --bg: #f7fafc;
    --paper: #ffffff;
    --paper-soft: #f8fbfd;
    --ink: #111827;
    --navy: #073e63;
    --blue: #0b6fdb;
    --blue-dark: #045cb5;
    --teal: #0b87a5;
    --line: #d8e2eb;
    --muted: #657085;
    --muted-2: #8a96a8;
    --danger: #ef3340;
    --shadow: 0 18px 38px rgba(6, 37, 62, 0.1);
    --radius: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    letter-spacing: 0;
  }

  button, input {
    font: inherit;
  }

  button {
    color: inherit;
    cursor: pointer;
  }

  .app-shell {
    width: min(100%, 430px);
    min-height: 100vh;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 0 0 1px rgba(7, 62, 99, 0.08), var(--shadow);
    position: relative;
    overflow: clip;
  }

  .app-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 92px;
    padding: 16px 14px 11px;
    display: grid;
    gap: 11px;
    background: rgba(255, 255, 255, 0.96);
    color: var(--navy);
    backdrop-filter: blur(16px);
  }

  .brand-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) 40px;
    align-items: center;
    gap: 8px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    color: var(--navy);
  }

  .app-title {
    margin: 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.3rem;
    line-height: 1.15;
    font-weight: 900;
    color: var(--navy);
  }

  .icon-button {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 8px;
    display: inline-grid;
    place-items: center;
    background: transparent;
    color: currentColor;
    position: relative;
  }

  .brand-row .icon-button {
    width: 40px;
    height: 40px;
    justify-self: end;
  }

  .icon-button:hover,
  .icon-button:focus-visible {
    outline: none;
    background: #eef6fc;
  }

  .badge {
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: var(--danger);
    color: #fff;
    font-size: 0.76rem;
    line-height: 1;
    font-weight: 850;
  }

  .icon-button .badge {
    position: absolute;
    top: 3px;
    right: 2px;
    border: 2px solid #fff;
  }

  main {
    padding: 0 14px 24px;
  }

  @media (max-width: 759px) {
    .app-shell {
      margin: 0;
    }
  }

  .school-row {
    display: none;
    min-height: 72px;
    padding: 18px 0 16px;
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }

  .school-mark {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--navy);
    background: #eef7ff;
    border: 1px solid #bad4e8;
  }

  .school-title {
    margin: 0;
    font-size: 1.22rem;
    line-height: 1.25;
    font-weight: 850;
  }

  .updated {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.98rem;
    white-space: nowrap;
  }

  .updated svg {
    width: 19px;
    height: 19px;
  }

  .hero-date {
    margin-top: 2px;
    padding: 18px 16px 11px;
    border: 1px solid #ccdbe7;
    border-radius: var(--radius);
    background:
      linear-gradient(150deg, rgba(239, 248, 255, 0.95), rgba(255, 255, 255, 0.98) 58%),
      #fff;
  }

  .date-line {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    color: var(--navy);
  }

  .date-icon {
    flex: 0 0 auto;
    color: var(--teal);
  }

  .date-line h2 {
    margin: 0;
    font-size: 1.58rem;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0;
    color: var(--navy);
  }

  .weekday-pill {
    flex: 0 0 auto;
    min-width: 0;
    height: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    display: inline;
    background: transparent;
    color: var(--navy);
    font-size: 1.58rem;
    line-height: 1;
    font-weight: 850;
    box-shadow: none;
  }

  .day-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .today-btn {
    min-width: 48px;
    height: 38px;
    padding: 0 14px;
    border: 1px solid #bed4e4;
    border-radius: 999px;
    background: #fff;
    color: var(--navy);
    font-size: 0.95rem;
    font-weight: 850;
    box-shadow: 0 5px 14px rgba(19, 79, 117, 0.08);
  }

  .today-btn:hover,
  .today-btn:focus-visible {
    background: #eef6fc;
  }

  .day-nav .icon-button {
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--navy);
  }

  .day-nav .icon-button:hover,
  .day-nav .icon-button:focus-visible {
    background: #eef6fc;
  }

  .event-stack {
    margin-top: 8px;
    border-top: 0;
  }

  .publish-note {
    margin: 12px 0 0;
    color: #596b7a;
    font-size: 0.94rem;
    line-height: 1.5;
  }

  .event-row {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: left;
    display: grid;
    grid-template-columns: 66px 5px minmax(0, 1fr) auto;
    gap: 11px;
    align-items: center;
    padding: 12px 0 11px;
  }

  .event-row:last-child {
    border-bottom: 0;
  }

  .event-row:hover,
  .event-row:focus-visible {
    outline: none;
    background: rgba(242, 248, 252, 0.7);
  }

  .time-rail {
    color: #111827;
    font-size: 0.98rem;
    line-height: 1.22;
    font-weight: 850;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .time-rail .dash {
    display: block;
    height: auto;
    margin-left: 0;
    border-left: 0;
  }

  .dot-line {
    height: 100%;
    min-height: 47px;
    border-radius: 999px;
    background: var(--event-color);
  }

  .dot-line::after {
    display: none;
  }

  .dot {
    display: none;
  }

  .event-main {
    min-width: 0;
  }

  .event-title-line {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .subject-tag {
    min-width: 47px;
    height: 29px;
    padding: 0 10px;
    border-radius: 6px;
    display: inline-grid;
    place-items: center;
    background: var(--event-color);
    color: #fff;
    font-size: 0.92rem;
    line-height: 1;
    font-weight: 850;
    white-space: nowrap;
  }

  .event-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.08rem;
    line-height: 1.22;
    font-weight: 850;
  }

  .event-side:empty,
  .compact-side:empty {
    display: none;
  }

  .chevron {
    color: var(--muted-2);
  }

  .event-side,
  .compact-side {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #2f3746;
    font-size: 0.88rem;
    white-space: nowrap;
  }

  .compact-side {
    justify-content: end;
    font-size: 0.88rem;
  }

  .event-row .chevron {
    display: none;
  }

  .section-title {
    margin: 0;
    color: var(--navy);
    font-size: 1.42rem;
    line-height: 1.2;
    font-weight: 850;
  }

  .week-panel {
    display: none;
  }

  .agenda-panel {
    padding-top: 0;
    margin-top: 24px;
  }

  .week-strip {
    margin-top: 11px;
    display: grid;
    grid-template-columns: repeat(7, minmax(47px, 1fr));
    gap: 6px;
  }

  .day-cell {
    min-width: 0;
    min-height: 92px;
    padding: 8px 4px 7px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 5px;
  }

  .day-cell.active {
    border-color: var(--blue);
    background: #f3f9ff;
    box-shadow: inset 0 0 0 1px rgba(8, 110, 215, 0.1);
  }

  .day-cell:hover,
  .day-cell:focus-visible {
    outline: none;
    border-color: #7fb7ed;
    background: #f6fbff;
  }

  .day-week {
    color: #5d6570;
    font-size: 0.98rem;
    line-height: 1;
    font-weight: 760;
  }

  .day-date {
    color: #313846;
    font-size: 0.86rem;
    line-height: 1;
  }

  .day-count {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--day-color);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 850;
  }

  .day-dots {
    min-height: 8px;
    display: flex;
    gap: 4px;
  }

  .mini-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot-color);
  }

  .agenda-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .filter-button {
    height: 38px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: var(--navy);
    font-size: 1rem;
    font-weight: 850;
  }

  .filter-button:hover,
  .filter-button:focus-visible {
    outline: none;
    background: #eef7ff;
  }

  .chip-row {
    margin-top: 16px;
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }

  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    height: 39px;
    padding: 0 15px;
    border: 1px solid var(--navy);
    border-radius: 999px;
    background: #fff;
    color: var(--navy);
    font-size: 0.98rem;
    font-weight: 760;
    white-space: nowrap;
  }

  .chip.on {
    border-color: transparent;
    background: linear-gradient(135deg, #0d8fb2, #0873d5);
    color: #fff;
    box-shadow: 0 9px 18px rgba(8, 110, 215, 0.18);
  }

  .agenda-list {
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper);
  }

  .date-group + .date-group {
    border-top: 1px solid var(--line);
  }

  .date-group-head {
    min-height: 40px;
    padding: 8px 13px 8px 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    background: linear-gradient(180deg, #fbfdff, #f3f7fa);
    color: var(--navy);
    font-size: 1.08rem;
    font-weight: 850;
  }

  .date-group-count {
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .compact-event {
    width: 100%;
    min-height: 62px;
    padding: 10px 10px 10px 12px;
    border: 0;
    border-top: 1px solid #edf2f6;
    background: #fff;
    display: grid;
    grid-template-columns: 5px 84px minmax(0, 1fr) auto;
    gap: 9px;
    align-items: center;
    text-align: left;
  }

  .compact-event:first-of-type {
    border-top: 0;
  }

  .compact-event:hover,
  .compact-event:focus-visible {
    outline: none;
    background: #f7fbff;
  }

  .color-bar {
    width: 5px;
    height: 42px;
    border-radius: 999px;
    background: var(--event-color);
  }

  .compact-time {
    color: #1f2937;
    font-size: 0.96rem;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .compact-title {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .compact-title strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.06rem;
    line-height: 1.18;
    font-weight: 850;
  }

  .small-tag {
    min-width: 45px;
    height: 28px;
    padding: 0 8px;
    border-radius: 5px;
    display: inline-grid;
    place-items: center;
    background: var(--event-color);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 850;
    white-space: nowrap;
  }

  .empty-state {
    padding: 24px 18px;
    text-align: center;
    color: var(--muted);
    line-height: 1.45;
  }

  .recent-panel {
    margin-top: 26px;
  }

  .recent-list {
    margin-top: 8px;
  }

  .recent-item {
    width: 100%;
    min-height: 50px;
    padding: 10px 8px;
    border: 0;
    border-bottom: 1px solid #edf2f6;
    background: transparent;
    display: grid;
    grid-template-columns: 30px 1fr auto 20px;
    gap: 8px;
    align-items: center;
    text-align: left;
  }

  .recent-item:hover,
  .recent-item:focus-visible {
    outline: none;
    background: #f7fbff;
  }

  .recent-kind {
    color: var(--event-color);
    display: grid;
    place-items: center;
  }

  .recent-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.02rem;
    font-weight: 720;
  }

  .recent-date {
    color: var(--muted);
    font-size: 0.95rem;
    text-align: right;
    white-space: nowrap;
  }

  .recent-item.cancel-event {
    background: #fff2f3;
    box-shadow: inset 3px 0 0 var(--danger);
    border-radius: 0 8px 8px 0;
  }

  .event-row.cancel-event,
  .compact-event.cancel-event {
    background: #fff2f3;
  }

  .event-row.cancel-event:hover,
  .event-row.cancel-event:focus-visible,
  .compact-event.cancel-event:hover,
  .compact-event.cancel-event:focus-visible,
  .recent-item.cancel-event:hover,
  .recent-item.cancel-event:focus-visible {
    background: #ffe9ec;
  }

  .cancel-event .event-name,
  .cancel-event .compact-title strong,
  .cancel-event .recent-text {
    color: #b80012;
  }

  .drawer,
  .sheet,
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
  }

  .drawer.show,
  .sheet.show,
  .modal.show {
    display: block;
  }

  .scrim {
    position: absolute;
    inset: 0;
    border: 0;
    background: rgba(13, 29, 45, 0.42);
  }

  .drawer-panel {
    position: absolute;
    inset: 0 auto 0 0;
    width: min(82vw, 340px);
    padding: 18px;
    background: #fff;
    box-shadow: 16px 0 38px rgba(7, 42, 68, 0.18);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .panel-title {
    margin: 0;
    color: var(--navy);
    font-size: 1.16rem;
    font-weight: 850;
  }

  .drawer-link {
    width: 100%;
    min-height: 48px;
    margin-top: 8px;
    padding: 0 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    font-weight: 760;
  }

  .drawer-link .badge {
    margin-left: auto;
  }

  .drawer-link:hover,
  .drawer-link:focus-visible {
    outline: none;
    background: #f0f7fc;
  }

  .drawer-note {
    margin: 18px 0 0;
    padding: 12px;
    border-radius: 8px;
    background: #f5f9fc;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.45;
  }

  .sheet-panel {
    position: absolute;
    inset: auto 0 0;
    max-height: min(86vh, 650px);
    padding: 16px 16px calc(18px + var(--safe-bottom));
    overflow: auto;
    background: #fff;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -16px 38px rgba(7, 42, 68, 0.18);
  }

  .secondary-button {
    min-height: 44px;
    border-radius: 8px;
    font-weight: 850;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--navy);
  }

  .modal-panel {
    position: absolute;
    inset: auto 12px 14px;
    max-width: 456px;
    margin: 0 auto;
    padding: 16px;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 -12px 40px rgba(7, 42, 68, 0.22);
  }

  .modal-panel .subject-tag {
    min-width: auto;
    display: inline-grid;
  }

  .modal-title {
    margin: 12px 0 6px;
    font-size: 1.3rem;
    line-height: 1.25;
    font-weight: 900;
  }

  .modal-time {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 1rem;
  }

  .detail-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #f6f9fc;
    color: #334155;
    white-space: pre-wrap;
    line-height: 1.55;
  }

  .modal-actions {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
  }

  .tt-sub {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .tt-note {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-left: 4px solid #f9a825;
    border-radius: 8px;
    background: #fff8e1;
    color: #4d3f12;
    font-size: 0.95rem;
    line-height: 1.55;
  }

  .tt-day {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .tt-day-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #eef3f8;
    color: var(--navy);
    font-size: 1.02rem;
    font-weight: 850;
  }

  .tt-day.weekend .tt-day-head {
    background: #fdf2e3;
    color: #b9770e;
  }

  .tt-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-top: 1px dashed #e7edf2;
    font-size: 1rem;
  }

  .tt-time {
    flex: 0 0 auto;
    min-width: 96px;
    color: var(--muted);
    font-size: 0.94rem;
    font-variant-numeric: tabular-nums;
  }

  .tt-subj {
    flex: 0 0 auto;
    padding: 2px 9px;
    border-radius: 6px;
    color: #fff;
    font-size: 0.88rem;
    font-weight: 800;
  }

  .view-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--navy);
    border-radius: 999px;
    overflow: hidden;
    background: #fff;
  }

  .view-tab {
    min-height: 38px;
    border: 0;
    background: transparent;
    color: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 1rem;
    font-weight: 800;
  }

  .view-tab.on {
    background: var(--navy);
    color: #fff;
  }

  .month-panel {
    margin-top: 6px;
  }

  .month-nav {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 6px;
  }

  .month-nav h2 {
    margin: 0;
    text-align: center;
    color: var(--navy);
    font-size: 1.34rem;
    font-weight: 900;
  }

  .month-nav .icon-button:disabled {
    opacity: 0.3;
  }

  .month-hint {
    margin: 10px 0 0;
    padding: 9px 12px;
    border-left: 4px solid #f28c00;
    border-radius: 8px;
    background: #fff6ea;
    color: #5d431a;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .month-grid {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }

  .m-weekhead {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 7px 0;
    background: linear-gradient(180deg, #fbfdff, #f3f7fa);
    color: var(--navy);
    font-size: 0.92rem;
    font-weight: 800;
    text-align: center;
  }

  .m-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-flow: row dense;
    border-top: 1px solid #e8eef3;
    padding-bottom: 5px;
  }

  .m-cell {
    grid-row: 1;
    min-height: 60px;
    padding: 5px 1px 2px;
    border: 0;
    border-left: 1px solid #f0f4f7;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .m-cell:first-child {
    border-left: 0;
  }

  .m-date {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #313846;
    font-size: 0.98rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .m-cell.today .m-date {
    background: var(--blue);
    color: #fff;
    font-weight: 850;
  }

  .m-cell.closed {
    background: #fff2f3;
  }

  .m-cell.closed .m-date {
    color: #b80012;
    font-weight: 850;
  }

  .m-cell.selected {
    box-shadow: inset 0 0 0 2px var(--blue);
    border-radius: 6px;
  }

  .month-detail {
    margin-top: 16px;
  }

  .m-chip {
    max-width: 100%;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--chip-color);
    color: #fff;
    font-size: 0.78rem;
    line-height: 1.45;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .m-more {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .m-bar {
    height: 22px;
    margin: 3px 3px 0;
    padding: 0 7px;
    border: 0;
    border-radius: 6px;
    background: var(--bar-color);
    color: #fff;
    font-size: 0.8rem;
    line-height: 22px;
    font-weight: 800;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .month-legend {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .month-legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .month-legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 4px;
    background: var(--lg-color);
  }

  .month-legend i.closed-sample {
    background: #fff2f3;
    border: 1px solid var(--danger);
  }

  .toast {
    position: fixed;
    z-index: 80;
    left: 50%;
    bottom: calc(18px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    max-width: min(88vw, 360px);
    padding: 10px 14px;
    border-radius: 8px;
    background: #102338;
    color: #fff;
    font-weight: 760;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 390px) {
    main { padding-inline: 12px; }
    .app-bar { padding: 22px 15px 16px; }
    .app-title { font-size: 1.24rem; }
    .brand-row { grid-template-columns: 32px minmax(0, 1fr) 42px; gap: 7px; }
    .hero-date { padding-inline: 18px; }
    .date-line h2,
    .weekday-pill { font-size: 1.52rem; }
    .event-row { grid-template-columns: 62px 5px minmax(0, 1fr) auto; gap: 10px; }
    .time-rail { font-size: 0.98rem; }
    .event-name { font-size: 1.06rem; }
    .subject-tag { min-width: 48px; height: 29px; font-size: 0.92rem; }
    .compact-event { grid-template-columns: 5px 78px minmax(0, 1fr) auto; gap: 9px; }
    .compact-time { font-size: 0.94rem; }
  }

  @media (min-width: 760px) {
    body { padding: 22px 0; }
    .app-shell {
      border-radius: 8px;
      min-height: calc(100vh - 44px);
    }
    .app-bar {
      border-radius: 8px 8px 0 0;
    }
    .drawer,
    .sheet,
    .modal {
      position: absolute;
    }
  }
</style>
</head>
<body>
<div class="app-shell" id="app">
  <header class="app-bar">
    <div class="brand-row">
      <div class="brand-mark"><i data-lucide="calendar-days" size="32"></i></div>
      <h1 class="app-title" id="siteTitle">高名文理補習班 國三班行事曆</h1>
      <button class="icon-button" type="button" data-action="open-menu" aria-label="開啟選單">
        <i data-lucide="menu" size="34"></i>
      </button>
    </div>
    <div class="updated"><i data-lucide="clock-3" size="21"></i><span id="updatedText">載入中</span></div>
    <div class="view-switch" role="tablist" aria-label="切換顯示模式">
      <button class="view-tab on" type="button" role="tab" id="tabList" aria-selected="true" data-action="set-view" data-view="list"><i data-lucide="list" size="18"></i>列表</button>
      <button class="view-tab" type="button" role="tab" id="tabMonth" aria-selected="false" data-action="set-view" data-view="month"><i data-lucide="calendar" size="18"></i>月曆</button>

  </header>

  <main>
    <section class="hero-date" id="todayPanel" aria-label="今日行程">
      <div class="date-line">
        <i class="date-icon" data-lucide="calendar-days" size="31"></i>
        <h2 id="selectedDateTitle">--</h2>
        <button class="weekday-pill" type="button" data-action="jump-today" id="weekdayPill">--</button>
        <div class="day-nav">

    <section class="week-panel" id="weekPanel" aria-label="本週速覽">

    <section class="recent-panel" id="recentPanel" aria-label="重要通知">
      <div class="agenda-header">
        <h2 class="section-title">重要通知</h2>
        <button class="filter-button" type="button" data-action="open-notices">查看全部 <i data-lucide="chevron-right" size="19"></i></button>

      <div class="month-nav">

        <h2 id="monthTitle">--</h2>
        <button class="icon-button" type="button" id="monthNext" data-action="month-next" aria-label="下個月"><i data-lucide="chevron-right" size="26"></i></button>
      </div>
      <p class="month-hint hidden" id="monthHint"></p>
      <div class="month-grid">
        <div class="m-weekhead"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="monthWeeks"></div>
      </div>

        <span><i style="--lg-color:#ef3340"></i>高名模考</span>

  <div class="drawer" id="menuDrawer" aria-hidden="true">

      </div>
      <button class="drawer-link" type="button" data-action="open-timetable"><i data-lucide="clipboard-list"></i>每週課表</button>
      <button class="drawer-link" type="button" data-action="open-notices"><i data-lucide="bell"></i>重要通知 <span class="badge" id="noticeBadge">0</span></button>
      <a class="drawer-link" href="print.html" style="text-decoration:none;color:inherit"><i data-lucide="printer"></i>紙本進度表</a>
      <a class="drawer-link" href="index.html" style="text-decoration:none;color:inherit"><i data-lucide="external-link"></i>查看目前正式版</a>
      <p class="drawer-note" id="drawerNote">這是互動 prototype，資料來源與正式行事曆相同。</p>
    </aside>
  </div>

  <div class="sheet" id="noticeSheet" aria-hidden="true">
    <button class="scrim" type="button" data-action="close-panels" aria-label="關閉"></button>
    <section class="sheet-panel" aria-label="通知">
      <div class="panel-head">

        <button class="icon-button" type="button" data-action="close-panels" aria-label="關閉通知"><i data-lucide="x"></i></button>
      </div>
      <div class="recent-list" id="noticeList"></div>
    </section>

  <div class="sheet" id="timetableSheet" aria-hidden="true">

        <span class="subject-tag" id="modalTag">行程</span>
        <button class="icon-button" type="button" data-action="close-panels" aria-label="關閉詳情"><i data-lucide="x"></i></button>

        <h2 class="panel-title" id="dayModalTitle"></h2>

      </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUBJECT_COLORS = {
  "國文": "#ef3340",
  "英文": "#086ed7",
  "數學": "#1768d8",
  "自然": "#21a667",
  "社會": "#d66a00",
  "國文/社會": "#815034",
};

const TYPE_COLORS = {
  "暑訓": "#f28c00",
  "模考與複習": "#ef3340",
  "重要日程": "#7c43c6",
  "停課": "#ef3340",
  "備註": "#0b75d1",
};

const SUBJECT_GROUPS = {
  "理化": "自然",
  "生物": "自然",
  "歷史": "社會",
  "地理": "社會",
  "公民與社會": "社會",
};
const MOCK_TYPES = ["高名模考", "模考"];
const REVIEW_TYPES = ["複習卷"];
const NOTICE_TYPES = ["停課", "備註", "重要日程"];
const SUBJECT_OPTIONS = ["全部", "國文", "英文", "數學", "自然", "社會"];

const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];
const state = {
  data: null,
  events: [],
  selectedDate: "",
  defaultDate: "",
  activeSubject: "全部",
  copyText: "",
  view: "list",
  monthCursor: "",
  monthDetailDate: "",
};

const el = (id) => document.getElementById(id);

fetch("events.json?v=" + Date.now())
  .then((response) => {
    if (!response.ok) throw new Error("events.json load failed");
    return response.json();
  })
  .then((data) => {
    state.data = data;
    state.events = data.events.map(normalizeEvent);
    state.defaultDate = chooseDefaultDate(data);
    state.selectedDate = state.defaultDate;
    hydrateStatic(data);
    render();
  })
  .catch((error) => {
    el("todayEvents").innerHTML = '<div class="empty-state">行事曆資料載入失敗，請重新整理後再試。</div>';
    console.error(error);
  });

function hydrateStatic(data) {
  el("siteTitle").textContent = data.site_title;
  el("drawerTitle").textContent = data.site_title;
  el("updatedText").textContent = data.generated_at + " 更新";
  el("drawerNote").textContent = "已公布至 " + formatShortDate(data.range.end) + "，後續進度老師確認後更新。這是互動 prototype，正式版仍在 index.html。";
  el("publishNote").textContent = "🔒 本行事曆已公布至 " + formatMonthDay(data.range.end) + "，後續進度暫定中，老師確認後更新。";
  renderTimetable(data);
}

function renderTimetable(data) {
  el("ttSub").textContent = "自 " + formatShortDate(data.range.start) + " 起適用，每週循環";
  let html = "";
  if (data.summer_info) {
    const si = data.summer_info;
    html += `<div class="tt-note">☀️ <b>暑訓</b>（僅參加的學生）：${formatMonthDay(si.start)}～${formatMonthDay(si.end)}，${escapeHTML(si.time)}`;
    if (si.mock_week_start) html += `<br>暑訓模考週：${formatMonthDay(si.mock_week_start)} 起一週，${escapeHTML(si.mock_time)}`;
    html += `</div>`;
  }
  const order = ["一", "二", "三", "四", "五", "六", "日"];
  order.forEach((wd) => {
    const rows = (data.timetable || []).filter((row) => row.weekday === wd);
    if (!rows.length) return;
    const weekend = wd === "六" || wd === "日";
    html += `<section class="tt-day${weekend ? " weekend" : ""}"><div class="tt-day-head">週${wd}</div>` +
      rows.map((row) => {
        const chip = row.subject
          ? `<span class="tt-subj" style="background:${SUBJECT_COLORS[groupSubject(row.subject)] || "#607d8b"}">${escapeHTML(groupSubject(row.subject))}</span>`
          : "";
        return `<div class="tt-row"><span class="tt-time">${escapeHTML(row.start_time)}–${escapeHTML(row.end_time)}</span>${chip}<span>${escapeHTML(row.activity)}</span></div>`;
      }).join("") + `</section>`;
  });
  html += `<div class="tt-note">複習卷、高名模考等實際考程以行事曆為準；停課日當天課程全部暫停。</div>`;
  el("ttBody").innerHTML = html;
}

function normalizeEvent(raw, index) {
  const startDate = raw.start.slice(0, 10);
  const allDay = !!raw.allDay || !raw.start.includes("T");
  const endDate = raw.end ? raw.end.slice(0, 10) : startDate;
  const start = parseLocal(raw.start);
  const end = raw.end ? parseLocal(raw.end) : null;
  const color = colorOf(raw);
  return {
    ...raw,
    id: "event-" + index,
    allDay,
    start,
    end,
    startDate,
    endDate,
    color,
    sortKey: start.getTime(),
  };
}

function chooseDefaultDate(data) {
  const today = localDateKey(new Date());
  // 開課（課表生效日）前也讓今日卡／本週清單／重要通知從「今天」起算，
  // 這樣 6/26 前的停課、考前特訓等近期行程才會出現在重要通知，而不是被鎖在生效日。
  if (today <= data.range.end) return today;
  return data.range.start;
}

// 換日／導覽可回溯的最早日：起點與今天取較早者（開課前今天可能早於課表生效日）
function displayStart(data) {
  const start = data.range.start;
  const today = localDateKey(new Date());
  return today < start ? today : start;
}

function render() {
  const monthMode = state.view === "month";
  el("tabList").classList.toggle("on", !monthMode);
  el("tabMonth").classList.toggle("on", monthMode);
  el("tabList").setAttribute("aria-selected", String(!monthMode));
  el("tabMonth").setAttribute("aria-selected", String(monthMode));
  el("todayPanel").classList.toggle("hidden", monthMode);
  el("recentPanel").classList.toggle("hidden", monthMode);
  el("agendaPanel").classList.toggle("hidden", monthMode);
  el("monthPanel").classList.toggle("hidden", !monthMode);
  if (monthMode) renderMonth();
  renderHero();
  renderWeekStrip();
  renderSubjectChips();
  renderAgenda();
  renderRecent();
  updateNoticeBadge();
  syncIcons();
}

// ---- 月曆模式：只放重要日程（模考／停課／備註／重要日程），複習卷與每日暑訓不上 ----

function monthOf(dateKey) {
  return dateKey.slice(0, 7);
}

function shiftMonth(cursor, delta) {
  const [year, month] = cursor.split("-").map(Number);
  const d = new Date(year, month - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function clampMonth(cursor) {
  const min = monthOf(displayStart(state.data));
  const max = monthOf(state.data.range.end);
  return cursor < min ? min : cursor > max ? max : cursor;
}

function addDaysKey(dateKey, days) {
  const d = parseLocal(dateKey);
  d.setDate(d.getDate() + days);
  return localDateKey(d);
}

function dayDiff(from, to) {
  return Math.round((parseLocal(to) - parseLocal(from)) / 86400000);
}

function barLabel(event) {
  return event.title.replace(/（[^（）]+）$/, "");
}

function renderMonth() {
  if (!state.monthCursor) state.monthCursor = monthOf(state.defaultDate);
  state.monthCursor = clampMonth(state.monthCursor);
  const [year, month] = state.monthCursor.split("-").map(Number);
  el("monthTitle").textContent = `${year}年${month}月`;
  el("monthPrev").disabled = state.monthCursor <= monthOf(displayStart(state.data));
  el("monthNext").disabled = state.monthCursor >= monthOf(state.data.range.end);

  const monthStart = `${state.monthCursor}-01`;
  const monthEndExcl = `${shiftMonth(state.monthCursor, 1)}-01`;

  // 暑訓期間提示列（每日暑訓不進格子）
  const si = state.data.summer_info;
  const showHint = si && si.start < monthEndExcl && monthStart <= si.end;
  el("monthHint").classList.toggle("hidden", !showHint);
  if (showHint) el("monthHint").textContent = `☀️ 暑訓期間 ${formatMonthDay(si.start)}～${formatMonthDay(si.end)}（僅參加學生），${si.time}`;

  // 整理：跨日事件畫色條、單日事件放短標籤、停課日整格淡紅底
  const bars = [];
  const singles = new Map();
  const closed = new Set();
  state.events.filter((event) => isNoticeEvent(event) && !isMockEvent(event)).forEach((event) => {
    const endExcl = event.allDay && event.endDate > event.startDate ? event.endDate : addDaysKey(event.startDate, 1);
    if (event.type === "停課") {
      for (let date = event.startDate; date < endExcl; date = addDaysKey(date, 1)) closed.add(date);
    }
    if (dayDiff(event.startDate, endExcl) > 1) {
      bars.push({ start: event.startDate, endExcl, color: event.color, label: barLabel(event), date: event.startDate });
    } else {
      const list = singles.get(event.startDate) || [];
      list.push({ label: tagText(event), color: event.color });
      singles.set(event.startDate, list);
    }
  });
  // 高名模考：每回（一～五）合併畫一條紅色條，不逐日放標籤
  mockRounds().forEach((round) => {
    bars.push({ start: round.startDate, endExcl: addDaysKey(round.endDate, 1), color: TYPE_COLORS["模考與複習"], label: `模考${round.label}`, date: round.startDate });
  });
  // 暑訓模考週（僅暑訓學生）：以設定推得的一～五畫橘色條
  if (si && si.mock_week_start) {
    bars.push({ start: si.mock_week_start, endExcl: addDaysKey(si.mock_week_start, 5), color: TYPE_COLORS["暑訓"], label: "暑訓模考", date: si.mock_week_start });
  }

  const firstDay = parseLocal(monthStart);
  const offset = (firstDay.getDay() + 6) % 7; // 週一起始
  const gridStart = addDaysKey(monthStart, -offset);
  const todayKey = localDateKey(new Date());
  let html = "";
  for (let weekStart = gridStart; weekStart < monthEndExcl; weekStart = addDaysKey(weekStart, 7)) {
    const weekEndExcl = addDaysKey(weekStart, 7);
    let cells = "";
    for (let i = 0; i < 7; i++) {
      const date = addDaysKey(weekStart, i);
      if (date < monthStart || date >= monthEndExcl) {
        cells += '<span class="m-cell m-blank"></span>';
        continue;
      }
      const chips = singles.get(date) || [];
      const shown = chips.slice(0, 2).map((chip) => `<span class="m-chip" style="--chip-color:${chip.color}">${escapeHTML(chip.label)}</span>`).join("");
      const more = chips.length > 2 ? `<span class="m-more">+${chips.length - 2}</span>` : "";
      const classes = ["m-cell"];
      if (closed.has(date)) classes.push("closed");
      if (date === todayKey) classes.push("today");
      if (date === state.monthDetailDate) classes.push("selected");
      cells += `<button class="${classes.join(" ")}" type="button" data-action="month-pick" data-date="${date}" aria-label="${formatLongDate(date)}"><span class="m-date">${Number(date.slice(8))}</span>${shown}${more}</button>`;
    }
    let barHtml = "";
    bars.forEach((bar) => {
      const start = [bar.start, weekStart, monthStart].sort().pop();
      const end = [bar.endExcl, weekEndExcl, monthEndExcl].sort().shift();
      if (start >= end) return;
      barHtml += `<button class="m-bar" type="button" data-action="month-pick" data-date="${bar.date}" style="grid-column:${dayDiff(weekStart, start) + 1} / ${dayDiff(weekStart, end) + 1};--bar-color:${bar.color}">${escapeHTML(bar.label)}</button>`;
    });
    html += `<div class="m-week">${cells}${barHtml}</div>`;
  }
  el("monthWeeks").innerHTML = html;
}

function openDayModal(date) {
  const events = eventsForDate(date, false);
  el("dayModalTitle").textContent = formatLongDate(date);
  el("dayModalList").innerHTML = events.length
    ? events.map((event) => compactEventTemplate(event)).join("")

}

function renderHero() {

function renderWeekStrip() {

      <button class="day-cell ${date === state.selectedDate ? "active" : ""}" type="button" data-action="select-date" data-date="${date}" aria-label="${formatLongDate(date)}，${events.length} 個行程">

function renderSubjectChips() {

    const style = active && color ? ` style="background:${color};border-color:transparent;color:#fff;box-shadow:none"` : "";
    return `<button class="chip ${active ? "on" : ""}" type="button" data-action="set-subject" data-subject="${escapeAttr(subject)}"${style}>${escapeHTML(subject)}</button>`;
  }).join("");
}

function renderAgenda() {
  const days = weekDays(state.selectedDate);
  const groups = days.map((date) => ({ date, events: eventsForDate(date, true) }))
    .filter((group) => group.events.length > 0);
  el("agendaList").innerHTML = groups.length
    ? groups.map((group) => dateGroupTemplate(group)).join("")
    : '<div class="empty-state">本週沒有符合條件的行程。可以點「全部」或換一天看看。</div>';

function renderRecent() {
  // 首頁與「查看全部」用不同的天數視窗（設定.csv：首頁通知天數／通知面板天數），
  // 被釘選的通知不受天數限制、兩邊都會出現。視窗天數放寬時請同步調整 設定.csv。
  const homeItems = noticeItems(noticeDaysHome());
  const allItems = noticeItems(noticeDaysAll());
  el("recentList").innerHTML = homeItems.map(noticeItemTemplate).join("")
    || '<div class="empty-state">近期沒有停課、模考或備註等重要通知。</div>';
  el("noticeList").innerHTML = allItems.map(noticeItemTemplate).join("")
    || '<div class="empty-state">目前沒有通知。</div>';
}

function noticeDaysHome() {
  return Number(state.data && state.data.notice_days_home) || 14;
}

function noticeDaysAll() {
  return Number(state.data && state.data.notice_days_all) || 30;
}

function updateNoticeBadge() {
  const count = noticeItems(noticeDaysAll()).length;
  el("noticeBadge").textContent = count > 9 ? "9+" : String(count);
}

function eventRowTemplate(event) {
  return `
    <button class="event-row${event.type === "停課" ? " cancel-event" : ""}" type="button" data-action="open-event" data-event-id="${event.id}" style="--event-color:${event.color}">
      <span class="time-rail">${timeRail(event)}</span>
      <span class="dot-line"><span class="dot"></span></span>
      <span class="event-main">
        <span class="event-title-line">
          <span class="subject-tag">${escapeHTML(tagText(event))}</span>
          <span class="event-name">${escapeHTML(cleanTitle(event))}</span>
        </span>
      </span>
      <span class="event-side">${sideMeta(event)}</span>
    </button>`;
}

function dateGroupTemplate(group) {
  const d = parseLocal(group.date);
  return `
    <section class="date-group">
      <div class="date-group-head">
        <span>${d.getMonth() + 1}月${d.getDate()}日 週${WEEKDAY_LABELS[d.getDay()]}</span>
        <span class="date-group-count">${group.events.length} 個行程 <i data-lucide="chevron-down" size="19"></i></span>
      </div>
      ${group.events.map((event) => compactEventTemplate(event)).join("")}

}

function compactEventTemplate(event) {
  return `
    <button class="compact-event${event.type === "停課" ? " cancel-event" : ""}" type="button" data-action="open-event" data-event-id="${event.id}" style="--event-color:${event.color}">
      <span class="color-bar"></span>
      <span class="compact-time">${compactTime(event)}</span>
      <span>
        <span class="compact-title"><span class="small-tag">${escapeHTML(tagText(event))}</span><strong>${escapeHTML(cleanTitle(event))}</strong></span>
      </span>
      <span class="compact-side">${sideMeta(event)}</span>
    </button>`;
}

function recentItemTemplate(event) {
  return `
    <button class="recent-item${event.type === "停課" ? " cancel-event" : ""}" type="button" data-action="open-event" data-event-id="${event.id}" style="--event-color:${event.color}">
      <span class="recent-kind"><i data-lucide="${noticeIcon(event)}"></i></span>
      <span class="recent-text">【${escapeHTML(noticeLabel(event))}】${escapeHTML(cleanTitle(event))}</span>
      <span class="recent-date">${formatEventDates(event)}</span>
      <span class="chevron"><i data-lucide="chevron-right" size="18"></i></span>
    </button>`;
}

function noticeItemTemplate(item) {
  if (item.kind === "round") return mockRoundTemplate(item.round);
  return recentItemTemplate(item.event);
}

function mockRoundTemplate(round) {
  return `
    <button class="recent-item" type="button" data-action="open-round" data-round="${escapeAttr(round.label)}" style="--event-color:${TYPE_COLORS["模考與複習"]}">
      <span class="recent-kind"><i data-lucide="file-check-2"></i></span>
      <span class="recent-text">【模考】高名模考 ${escapeHTML(round.label)}（一～五晚）</span>
      <span class="recent-date">${formatMonthDay(round.startDate)}–${formatMonthDay(round.endDate)}</span>
      <span class="chevron"><i data-lucide="chevron-right" size="18"></i></span>
    </button>`;
}

function eventsForDate(date, applyFilters) {
  return state.events
    .filter((event) => occursOn(event, date))
    .filter((event) => !applyFilters || matchesFilters(event))
    .sort(compareEvents);
}

// 高名模考依「第X回」分組（顯示層整合用；資料層仍是逐場事件）
function mockRounds() {
  const groups = new Map();
  state.events.filter(isMockEvent).forEach((event) => {
    const match = event.title.match(/第.+?回/);
    const key = match ? match[0] : event.startDate;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(event);
  });
  return [...groups.entries()].map(([label, events]) => {
    events.sort(compareTimelineEvents);
    return {
      label,
      events,
      startDate: events[0].startDate,
      endDate: events[events.length - 1].startDate,
      pinned: events.some((event) => event.pinned),
    };
  }).sort((a, b) => a.startDate.localeCompare(b.startDate));
}

// 重要提醒清單：高名模考每回一筆，其餘（停課/備註/重要日程）逐筆。
// maxDays = 只列今天起算這麼多天內的通知（首頁短、查看全部長）；不傳則不限上界。
// 釘選（pinned）的通知不受 maxDays 限制，永遠常駐（仍只顯示今天以後的）。
function noticeItems(maxDays) {
  const horizon = maxDays ? addDaysKey(state.defaultDate, maxDays) : null;
  const within = (sortDate, pinned) => pinned || !horizon || sortDate <= horizon;
  const rounds = mockRounds()
    .filter((round) => round.endDate >= state.defaultDate)
    .map((round) => ({ kind: "round", round, sortDate: round.startDate, pinned: !!round.pinned }))
    .filter((item) => within(item.sortDate, item.pinned));
  const others = state.events
    .filter((event) => isNoticeEvent(event) && !isMockEvent(event))
    .filter((event) => event.startDate >= state.defaultDate || (event.allDay && event.endDate > state.defaultDate))
    .map((event) => ({ kind: "event", event, sortDate: event.startDate, pinned: !!event.pinned }))
    .filter((item) => within(item.sortDate, item.pinned));
  return [...rounds, ...others].sort((a, b) => a.sortDate.localeCompare(b.sortDate));
}

function matchesFilters(event) {
  if (state.activeSubject === "全部") return true;
  if (event.type === "停課") return true; // 停課攸關安全，篩科目時仍顯示
  return groupSubject(event.subject) === state.activeSubject;
}

function isMockEvent(event) {
  return MOCK_TYPES.includes(event.type);
}

function isReviewEvent(event) {
  return REVIEW_TYPES.includes(event.type);
}

function isExamEvent(event) {
  return isMockEvent(event) || isReviewEvent(event);
}

function isNoticeEvent(event) {
  return isMockEvent(event) || NOTICE_TYPES.includes(event.type);
}

function occursOn(event, date) {
  if (!event.allDay) return event.startDate === date;
  const exclusiveEnd = event.endDate || event.startDate;
  return date >= event.startDate && date < exclusiveEnd;
}

function compareEvents(a, b) {
  if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
  return a.sortKey - b.sortKey || a.title.localeCompare(b.title, "zh-Hant");
}

function compareTimelineEvents(a, b) {
  return a.sortKey - b.sortKey || a.title.localeCompare(b.title, "zh-Hant");
}

function weekDays(date) {
  const d = parseLocal(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return Array.from({ length: 7 }, (_, index) => {
    const copy = new Date(d);
    copy.setDate(d.getDate() + index);
    return localDateKey(copy);
  });
}

function colorOf(event) {
  if (isMockEvent(event)) return TYPE_COLORS["模考與複習"];
  if (event.type === "停課") return TYPE_COLORS["停課"];
  if (event.type === "備註") return TYPE_COLORS["備註"];
  if (event.type === "重要日程") return TYPE_COLORS["重要日程"];
  return SUBJECT_COLORS[groupSubject(event.subject)] || TYPE_COLORS[event.type] || "#607d8b";
}

function cleanTitle(event) {
  if (isMockEvent(event)) {
    const title = event.title
      .replace(event.subject || "", "")
      .replace("高名模考", "")
      .replace("模考", "")
      .trim();
    return `${groupSubject(event.subject) || "模考"}${title ? " " + title : ""}`;
  }
  if (event.type === "暑訓") return `${event.subject}暑期訓練`;
  if (!event.subject) return event.title;
  const stripped = event.title.replace(event.subject, "").trim() || event.title;
  // 歸併大科（自然、社會）時標題保留細科名稱，週六歷地公才分得出來
  if (groupSubject(event.subject) !== event.subject) return `${event.subject}${stripped}`;
  return stripped;
}

function tagText(event) {
  if (isMockEvent(event)) return "模考";
  if (isReviewEvent(event)) return groupSubject(event.subject || "複習");
  if (event.type === "停課") return "停課";
  if (event.type === "備註") return "備註";
  if (event.type === "重要日程") return importantMonthLabel(event);
  if (event.type === "暑訓") return "暑訓";
  return groupSubject(event.subject || event.type);
}

function importantMonthLabel(event) {
  if (event.short_label) return event.short_label;
  const title = cleanTitle(event)
    .replace(/[（(][^）)]*[）)]/g, "")
    .replace(/\b\d{1,2}:\d{2}[–~-]\d{1,2}:\d{2}\b/g, "")
    .trim();
  if (title.includes("啟用新課表")) return "新課表";
  if (title.includes("第一堂")) return title.replace("第一堂課", "").replace("第一堂", "").slice(0, 4) || "開課";
  return title.slice(0, 4) || "日程";
}

function noticeLabel(event) {
  if (isMockEvent(event)) return "模考";
  if (event.type === "重要日程") return importantMonthLabel(event);
  return event.type;
}

function formatEventDates(event) {
  if (event.allDay && event.endDate && event.endDate > event.startDate) {
    const endIncl = new Date(parseLocal(event.endDate).getTime() - 86400000);
    const endKey = localDateKey(endIncl);
    if (endKey > event.startDate) return `${formatMonthDay(event.startDate)}–${formatMonthDay(endKey)}`;
  }
  return formatMonthDay(event.startDate);
}

function groupSubject(subject) {
  return SUBJECT_GROUPS[subject] || subject;
}

function sideMeta(event) {
  const book = extractDetail(event.detail, "冊別");
  if (book) return `<i data-lucide="book-open" size="19"></i><span>${escapeHTML(book)}</span>`;
  if (event.type === "停課") return '<i data-lucide="bell" size="19"></i><span>停課</span>';
  if (event.type === "備註" || event.type === "重要日程") return '<i data-lucide="bell" size="19"></i><span>請留意</span>';
  if (isMockEvent(event)) return '<i data-lucide="bell" size="19"></i><span>準時</span>';
  return "";
}

function compactDetail(event) {
  const book = extractDetail(event.detail, "冊別");
  const scope = extractDetail(event.detail, "範圍");
  const paper = extractDetail(event.detail, "卷別");
  if (isMockEvent(event)) return paper ? `卷別 ${paper}` : scope || event.type;
  if (book && scope) return `${book}・${scope}`;
  if (book || scope) return book || scope;
  if (event.detail) return event.detail.replace(/\n/g, "・");
  return event.type;
}

function extractDetail(detail, label) {
  if (!detail) return "";
  const line = detail.split("\n").find((item) => item.startsWith(label + "："));
  return line ? line.replace(label + "：", "") : "";
}

function timeRail(event) {
  if (event.allDay) return "全天";
  return `${pad(event.start.getHours())}:${pad(event.start.getMinutes())}<span class="dash">-</span>${event.end ? `${pad(event.end.getHours())}:${pad(event.end.getMinutes())}` : ""}`;
}

function compactTime(event) {
  if (event.allDay) return "全天";
  const start = `${pad(event.start.getHours())}:${pad(event.start.getMinutes())}`;
  const end = event.end ? `${pad(event.end.getHours())}:${pad(event.end.getMinutes())}` : "";
  return end ? `${start}-${end}` : start;
}

function formatLongDate(date) {
  const d = parseLocal(date);
  return `${d.getMonth() + 1}月${d.getDate()}日 週${WEEKDAY_LABELS[d.getDay()]}`;
}

function formatShortDate(date) {
  return date.replace(/-/g, "/");
}

function formatMonthDay(date) {
  const d = parseLocal(date);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function parseLocal(value) {
  return new Date(value.includes("T") ? value : value + "T00:00:00");
}

function localDateKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function pad(value) {
  return String(value).padStart(2, "0");
}

function distinct(values) {
  return [...new Set(values)];
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}

function escapeAttr(value) {
  return escapeHTML(value);
}

function noticeIcon(event) {
  if (isMockEvent(event)) return "file-check-2";
  if (event.type === "停課") return "megaphone";
  if (event.type === "重要日程") return "calendar-check";
  return "notebook-pen";
}

function syncIcons() {
  if (window.lucide) window.lucide.createIcons();
}

function scrollToId(id) {
  el(id).scrollIntoView({ behavior: "smooth", block: "start" });
}

function openPanel(id) {
  closePanels();
  el(id).classList.add("show");
  el(id).setAttribute("aria-hidden", "false");
  syncIcons();
}

function closePanels() {
  document.querySelectorAll(".drawer.show, .sheet.show, .modal.show").forEach((panel) => {
    panel.classList.remove("show");
    panel.setAttribute("aria-hidden", "true");
  });
}

function openEvent(id) {
  const event = state.events.find((item) => item.id === id);
  if (!event) return;
  const time = `${formatLongDate(event.startDate)}　${compactTime(event)}`;
  const detail = event.detail || compactDetail(event) || "（無其他說明）";
  el("modalTag").textContent = tagText(event);
  el("modalTag").style.background = event.color;
  el("modalTitle").textContent = event.title;
  el("modalTime").querySelector("span").textContent = time;
  el("modalDetail").textContent = detail;
  state.copyText = `${event.title}\n${time}\n${event.detail || ""}`.trim();
  openPanel("eventModal");
}

function openMockRound(label) {
  const round = mockRounds().find((item) => item.label === label);
  if (!round) return;
  const time = `${formatLongDate(round.startDate)} – ${formatLongDate(round.endDate)}　晚上測驗及輔導時段`;
  const lines = round.events.map((event) => {
    const scope = extractDetail(event.detail, "範圍");
    const note = extractDetail(event.detail, "備註");
    const bits = [`${formatMonthDay(event.startDate)}（${WEEKDAY_LABELS[parseLocal(event.startDate).getDay()]}）`, `${event.subject}　${compactTime(event)}`];
    if (scope) bits.push(`範圍 ${scope}`);
    if (note) bits.push(note);
    return bits.join("　");
  });
  const paper = extractDetail(round.events[0].detail, "卷別");
  const official = (round.events[0].detail || "").match(/官方模考日 (\d{4}-\d{2}-\d{2})/);
  if (paper) lines.push(`卷別：${paper}`);
  if (official) lines.push(`官方模考日 ${formatMonthDay(official[1])}（日），本班提前於當週一～五晚上考完`);
  el("modalTag").textContent = "模考";
  el("modalTag").style.background = TYPE_COLORS["模考與複習"];
  el("modalTitle").textContent = `高名模考 ${round.label}`;
  el("modalTime").querySelector("span").textContent = time;
  el("modalDetail").textContent = lines.join("\n");
  state.copyText = `高名模考 ${round.label}\n${time}\n${lines.join("\n")}`;
  openPanel("eventModal");
}

function showToast(message) {
  const toast = el("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 1900);
}

function shiftSelectedDate(delta) {
  const next = addDaysKey(state.selectedDate, delta);
  if (!state.data) return;
  if (next < displayStart(state.data)) {
    showToast("已到行事曆起始日");
    return;
  }
  if (next > state.data.range.end) {
    showToast(`${formatMonthDay(state.data.range.end)} 之後為暫定進度，老師確認後公布`);
    return;
  }
  state.selectedDate = next;
  render();
}

document.addEventListener("click", async (event) => {
  const trigger = event.target.closest("[data-action]");
  if (!trigger) return;
  const action = trigger.dataset.action;

  if (action === "open-menu") openPanel("menuDrawer");
  if (action === "open-notices") openPanel("noticeSheet");
  if (action === "open-timetable") openPanel("timetableSheet");
  if (action === "close-panels") closePanels();

  if (action === "set-view") {
    state.view = trigger.dataset.view;
    if (state.view === "month") {
      state.monthCursor = monthOf(state.selectedDate);
      state.monthDetailDate = state.selectedDate;
    }
    render();
    window.scrollTo({ top: 0 });
  }

  if (action === "month-prev" || action === "month-next") {
    state.monthCursor = clampMonth(shiftMonth(state.monthCursor, action === "month-prev" ? -1 : 1));
    render();
  }

  if (action === "month-pick") {
    state.monthDetailDate = trigger.dataset.date;
    state.selectedDate = trigger.dataset.date;
    render();
    openDayModal(trigger.dataset.date);
  }

  if (action === "select-date") {
    state.selectedDate = trigger.dataset.date;
    render();
  }

  if (action === "shift-date") {
    shiftSelectedDate(Number(trigger.dataset.delta));
  }

  if (action === "jump-today") {
    closePanels();
    state.view = "list";
    state.selectedDate = state.defaultDate;
    render();
    scrollToId("todayPanel");
  }

  if (action === "set-subject") {
    state.activeSubject = trigger.dataset.subject;
    render();
  }

  if (action === "open-event") openEvent(trigger.dataset.eventId);
  if (action === "open-round") openMockRound(trigger.dataset.round);

  if (action === "copy-event" && state.copyText) {
    try {
      await navigator.clipboard.writeText(state.copyText);
      showToast("已複製行程資訊");
    } catch {
      showToast("瀏覽器未允許複製，可直接查看詳情");
    }
  }
});

// 今日卡片左右滑切換日期（橫向位移夠大且大於縱向位移才觸發，避免和捲動衝突）
(() => {
  const panel = el("todayPanel");
  let startX = 0;
  let startY = 0;
  panel.addEventListener("touchstart", (event) => {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }, { passive: true });
  panel.addEventListener("touchend", (event) => {
    const dx = event.changedTouches[0].clientX - startX;
    const dy = event.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      shiftSelectedDate(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

window.addEventListener("load", syncIcons);
</script>
</body>
</html>
