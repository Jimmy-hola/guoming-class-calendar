<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙本進度表</title>
<style>
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: #111; background: #e9ecef; }

  /* 螢幕上的工具列（列印時隱藏） */
  #toolbar { position: sticky; top: 0; background: #1a5276; color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; z-index: 5; }
  #toolbar button { border: none; border-radius: 6px; padding: 8px 18px; font-size: 0.95rem; background: #fff; color: #1a5276; font-weight: 700; cursor: pointer; }
  #toolbar .hint { font-size: 0.8rem; opacity: 0.9; }

  .month { background: #fff; width: 277mm; min-height: 180mm; margin: 16px auto; padding: 6mm 7mm; page-break-after: always; }
  .month:last-child { page-break-after: auto; }
  .m-head { display: flex; align-items: center; gap: 4mm; border-bottom: 1mm solid #1a5276; padding-bottom: 1.6mm; margin-bottom: 2mm; }
  .m-badge { background: #1a5276; color: #fff; border-radius: 1.5mm; padding: 1mm 3.5mm; font-size: 15pt; font-weight: 800; letter-spacing: 1px; }
  .m-head h2 { margin: 0; font-size: 13pt; letter-spacing: 1px; color: #1a5276; }
  .m-head .sub { margin-left: auto; font-size: 9pt; color: #444; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { border: 1px solid #14425f; background: #1a5276; color: #fff; font-size: 10pt; padding: 1.2mm 0; letter-spacing: 2px; }
  th.sat { background: #b9770e; border-color: #8c5a0a; }
  td { border: 1px solid #555; vertical-align: top; padding: 1mm 1.2mm; height: 24mm; }
  td.sat { background: #fdf8ef; }
  td.empty { background: #f5f5f5; }
  td.closed { background: #e3e3e3; }
  .dnum { font-weight: 700; font-size: 10pt; color: #1a5276; }
  td.sat .dnum { color: #b9770e; }
  .closed .creason { font-size: 8pt; font-weight: 700; color: #b71c1c; margin-top: 1mm; }
  .note-bar { font-size: 7pt; border: 1px solid #c9a227; background: #fff3cd; color: #6b4f00; padding: 0 1mm; margin: 0.5mm 0; }
  .ev { font-size: 7.5pt; line-height: 1.35; margin: 0.5mm 0; border-left: 1mm solid #999; padding-left: 1mm; }
  .ev .t { color: #555; }
  .ev.mock { font-weight: 700; color: #8e1b12; }
  .ev.round { font-weight: 700; }
  .ev .scope { font-weight: 400; font-size: 6.8pt; color: #444; }
  .m-foot { margin-top: 2mm; font-size: 8pt; color: #444; display: flex; justify-content: space-between; }
  .m-foot .dot { display: inline-block; width: 2.2mm; height: 2.2mm; border-radius: 50%; margin-right: 0.8mm; vertical-align: -0.2mm; }
  .m-foot .lg { margin-right: 2.5mm; }
  .m-foot .ftxt { flex: 1; }
  .m-foot .qr-box { display: flex; align-items: center; gap: 1.6mm; flex-shrink: 0; margin-left: 3mm; }
  .m-foot .qr-img { width: 16mm; height: 16mm; display: block; }
  .m-foot .qr-cap { font-size: 7pt; color: #444; line-height: 1.3; text-align: left; }

  @media print {
    body { background: #fff; }
    #toolbar { display: none; }
    .month { margin: 0; width: auto; }
  }
  @page { size: A4 landscape; margin: 8mm; }
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="window.print()">🖨 列印</button>
  <span class="hint">列印設定請選「橫向」，每月會自動一頁。貼牆建議每月撕換。</span>
  <a href="index.html" style="margin-left:auto;color:#fff">← 回線上行事曆</a>
</div>
<div id="pages">載入中…</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
<script>
const SITE_URL = "https://jimmy-hola.github.io/guoming-class-calendar/";
const SHORT_SUBJ = { "公民與社會": "公民", "國文/社會": "國社" };
const short = (s) => SHORT_SUBJ[s] || s;
// 顯示層科目歸併：資料保留細科名稱，紙本標籤統一為「自然」「社會」
const SUBJECT_GROUPS = { "理化": "自然", "生物": "自然", "歷史": "社會", "地理": "社會", "公民與社會": "社會" };
const SUBJECT_COLORS = { "國文": "#c0392b", "英文": "#2980b9", "數學": "#8e44ad", "自然": "#229954", "社會": "#e67e22" };
const subjColor = (s) => SUBJECT_COLORS[SUBJECT_GROUPS[s] || s] || "#888";
const groupSubject = (s) => SUBJECT_GROUPS[s] || s;

fetch("events.json?v=" + Date.now())
  .then((r) => r.json())
  .then((data) => {
    document.title = data.site_title + "（紙本進度表）";
    // 依日期整理事件
    const byDate = {}, closedDays = {}, noteDays = {};
    const push = (m, k, v) => (m[k] = m[k] || []).push(v);
    for (const e of data.events) {
      if (e.allDay) {
        // 展開全天區間（end 為不含）
        let d = e.start;
        while (d < e.end) {
          if (e.type === "停課") closedDays[d] = e.title;
          else push(noteDays, d, e.title);
          d = addDays(d, 1);
        }
      } else {
        push(byDate, e.start.slice(0, 10), e);
      }
    }
    // 產生每個月
    const pages = document.getElementById("pages");
    pages.innerHTML = "";
    let [y, m] = data.range.start.split("-").map(Number);
    const printEnd = data.print_through || data.range.end;
    const [ey, em] = printEnd.split("-").map(Number);
    while (y < ey || (y === ey && m <= em)) {
      pages.appendChild(renderMonth(y, m, data, byDate, closedDays, noteDays));
      m++; if (m > 12) { m = 1; y++; }
    }
    fillQRCodes(SITE_URL);
  });

// 產生一張線上行事曆 QR code，塞進每一頁頁尾（避免列印時依賴外部連線重複請求）
function fillQRCodes(url) {
  const imgs = document.querySelectorAll(".qr-img");
  if (!imgs.length) return;
  const tmp = document.createElement("div");
  tmp.style.display = "none";
  document.body.appendChild(tmp);
  new QRCode(tmp, { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => {
    const canvas = tmp.querySelector("canvas");
    const img = tmp.querySelector("img");
    const src = canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");
    if (src) imgs.forEach((el) => (el.src = src));
    document.body.removeChild(tmp);
  }, 60);
}

function addDays(iso, n) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function evLine(e) {
  const bc = ` style="border-left-color:${subjColor(e.subject)}"`;
  if (e.type === "複習卷") {
    const m = e.title.match(/^(.+?)複習卷 第(\d+)回$/);
    const scopeLine = (e.detail.split("\n").find((l) => l.startsWith("範圍：")) || "").slice(3);
    const scope = scopeLine ? `<span class="scope">${scopeLine.slice(0, 16)}</span>` : "";
    return `<div class="ev round"${bc}>${short(groupSubject(m[1]))}卷${m[2]} ${scope}</div>`;
  }
  if (e.type === "高名模考") return `<div class="ev mock"${bc}>${e.title.replace("高名模考", "模考").replace(e.subject || "", groupSubject(e.subject || ""))}</div>`;
  const title = e.subject ? e.title.replace(e.subject, groupSubject(e.subject)) : e.title;
  return `<div class="ev"${bc}>${title}</div>`;
}
function renderMonth(y, m, data, byDate, closedDays, noteDays) {
  const sec = document.createElement("section");
  sec.className = "month";
  const mm = String(m).padStart(2, "0");
  const daysInMonth = new Date(y, m, 0).getDate();
  let html = `<div class="m-head"><span class="m-badge">${y} 年 ${m} 月</span><h2>${data.site_title}</h2><div class="sub">列印日 ${data.generated_at.split(" ")[0]}・線上版以網站為準</div></div>`;
  html += "<table><thead><tr>" + ["一", "二", "三", "四", "五", "六"].map((w, i) => `<th${i === 5 ? ' class="sat"' : ""}>週${w}</th>`).join("") + "</tr></thead><tbody>";
  // 先找出每一週（週一為首），只含一~六
  let day = 1;
  const firstDow = new Date(y, m - 1, 1).getDay(); // 0=日
  // 該月 1 號是星期幾 → 推回該週的週一日期偏移
  let cursor = 1 - ((firstDow + 6) % 7); // 該週週一的「日」數（可能 <=0）
  while (cursor <= daysInMonth) {
    let row = "", hasContent = false;
    for (let i = 0; i < 6; i++) { // 一~六
      const dnum = cursor + i;
      if (dnum < 1 || dnum > daysInMonth) { row += '<td class="empty"></td>'; continue; }
      const iso = `${y}-${mm}-${String(dnum).padStart(2, "0")}`;
      const evs = (byDate[iso] || []).slice().sort((a, b) => a.start.localeCompare(b.start));
      const closed = closedDays[iso];
      let cell = `<div class="dnum">${dnum}</div>`;
      (noteDays[iso] || []).forEach((n) => (cell += `<div class="note-bar">${n}</div>`));
      if (closed) cell += `<div class="creason">${closed}</div>`;
      else cell += evs.map(evLine).join("");
      if (closed || evs.length || (noteDays[iso] || []).length) hasContent = true;
      row += `<td class="${i === 5 ? "sat " : ""}${closed ? "closed" : ""}">${cell}</td>`;
    }
    html += `<tr>${row}</tr>`;
    cursor += 7;
  }
  html += "</tbody></table>";
  const legend = Object.entries(SUBJECT_COLORS).map(([s, c]) => `<span class="lg"><span class="dot" style="background:${c}"></span>${s}</span>`).join("");
  html += `<div class="m-foot"><span class="ftxt">${legend}　粗體＝模考與複習　灰底＝停課　（週日未列，無課；每週固定課表見線上行事曆「課表」）</span><span class="qr-box"><img class="qr-img" alt="線上行事曆 QR code"><span class="qr-cap">📱 手機掃碼<br>看線上行事曆</span></span></div>`;
  sec.innerHTML = html;
  return sec;
}
</script>
</body>
</html>
