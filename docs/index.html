<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級行事曆</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales-all.global.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #2c3e50; --muted: #78909c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
  header { background: #1a5276; color: #fff; padding: 14px 16px 10px; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  header .updated { font-size: 0.75rem; opacity: 0.85; margin-top: 4px; }
  .filters { padding: 8px 12px 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #b0bec5; background: #fff; color: var(--text); border-radius: 14px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; user-select: none; }
  .chip.on { background: #1a5276; border-color: #1a5276; color: #fff; }
  .legend { padding: 2px 12px 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.72rem; color: var(--muted); }
  .legend span::before { content: "●"; margin-right: 3px; color: var(--c); }
  #calendar { max-width: 980px; margin: 0 auto 24px; padding: 0 8px; background: transparent; }
  .fc { background: var(--card); border-radius: 10px; padding: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .fc .fc-toolbar-title { font-size: 1.05rem; }
  .fc .fc-button { font-size: 0.8rem; padding: 4px 8px; background: #1a5276; border-color: #1a5276; }
  .fc-event { cursor: pointer; font-size: 0.74rem; border: none; }
  .fc-event.type-模考 { box-shadow: inset 3px 0 0 #b71c1c; font-weight: 700; }
  /* 詳情視窗 */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
  #overlay.show { display: flex; }
  #modal { background: #fff; border-radius: 12px; max-width: 420px; width: 100%; padding: 18px 20px; }
  #modal h2 { margin: 0 0 6px; font-size: 1.05rem; }
  #modal .when { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
  #modal .body { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.6; }
  #modal .tag { display: inline-block; font-size: 0.72rem; border-radius: 10px; padding: 2px 10px; color: #fff; margin-bottom: 8px; }
  #modal button { margin-top: 14px; width: 100%; padding: 9px; border: none; border-radius: 8px; background: #1a5276; color: #fff; font-size: 0.9rem; cursor: pointer; }
  @media (max-width: 700px) {
    .fc .fc-toolbar { flex-wrap: wrap; gap: 6px; }
  }
</style>
</head>
<body>
<header style="position:relative">
  <a href="print.html" style="color:#fff;font-size:0.78rem;position:absolute;top:14px;right:16px">🖨 紙本進度表</a>
  <h1 id="siteTitle" style="padding-right:110px">班級行事曆</h1>
  <div class="updated" id="updated"></div>
</header>
<div class="filters" id="typeFilters"></div>
<div class="legend" id="legend"></div>
<div id="calendar"></div>

<div id="overlay">
  <div id="modal">
    <span class="tag" id="mTag"></span>
    <h2 id="mTitle"></h2>
    <div class="when" id="mWhen"></div>
    <div class="body" id="mBody"></div>
    <button onclick="document.getElementById('overlay').classList.remove('show')">關閉</button>
  </div>
</div>

<script>
const SUBJECT_COLORS = {
  "國文": "#c0392b", "英文": "#2980b9", "數學": "#8e44ad",
  "理化": "#16a085", "生物": "#27ae60", "自然": "#229954",
  "歷史": "#d35400", "地理": "#00838f", "公民與社會": "#ad1457",
  "社會": "#e67e22", "國文/社會": "#795548",
};
const TYPE_COLORS = { "測驗": "#607d8b", "正課": "#455a64", "停課": "#9e9e9e", "備註": "#f9a825", "模考": "#d32f2f" };
const TYPES = ["全部", "正課", "測驗", "暑訓", "複習卷", "模考", "停課與備註"];
let activeType = "全部";
let allEvents = [];
let calendar;

function colorOf(e) {
  if (e.type === "停課" || e.type === "備註") return TYPE_COLORS[e.type];
  return SUBJECT_COLORS[e.subject] || TYPE_COLORS[e.type] || "#607d8b";
}
function matchType(e) {
  if (activeType === "全部") return true;
  if (activeType === "停課與備註") return e.type === "停課" || e.type === "備註";
  return e.type === activeType;
}
function toFC(e) {
  return {
    title: e.title, start: e.start, end: e.end, allDay: !!e.allDay,
    backgroundColor: colorOf(e), borderColor: colorOf(e),
    classNames: ["type-" + e.type],
    extendedProps: { type: e.type, subject: e.subject, detail: e.detail },
  };
}
function refresh() {
  calendar.removeAllEvents();
  allEvents.filter(matchType).map(toFC).forEach((e) => calendar.addEvent(e));
}

fetch("events.json?v=" + Date.now())
  .then((r) => r.json())
  .then((data) => {
    document.getElementById("siteTitle").textContent = data.site_title;
    document.title = data.site_title;
    document.getElementById("updated").textContent = "最後更新：" + data.generated_at;
    allEvents = data.events;

    // 類型篩選按鈕
    const tf = document.getElementById("typeFilters");
    TYPES.forEach((t) => {
      const b = document.createElement("span");
      b.className = "chip" + (t === activeType ? " on" : "");
      b.textContent = t;
      b.onclick = () => {
        activeType = t;
        tf.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.textContent === t));
        refresh();
      };
      tf.appendChild(b);
    });

    // 科目圖例
    const lg = document.getElementById("legend");
    Object.entries(SUBJECT_COLORS).forEach(([s, c]) => {
      if (!allEvents.some((e) => e.subject === s)) return;
      const sp = document.createElement("span");
      sp.style.setProperty("--c", c);
      sp.textContent = s;
      lg.appendChild(sp);
    });

    const isMobile = window.innerWidth < 700;
    const today = new Date().toISOString().slice(0, 10);
    calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
      locale: "zh-tw",
      initialView: isMobile ? "listMonth" : "dayGridMonth",
      initialDate: today >= data.range.start && today <= data.range.end ? today : data.range.start,
      validRange: { start: data.range.start, end: addDays(data.range.end, 1) },
      headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,timeGridWeek,listMonth" },
      buttonText: { today: "今天", month: "月", week: "週", list: "清單" },
      height: "auto",
      dayMaxEventRows: 4,
      slotMinTime: "08:00:00",
      slotMaxTime: "22:00:00",
      allDaySlot: true,
      displayEventEnd: true,
      eventTimeFormat: { hour: "2-digit", minute: "2-digit", hour12: false },
      noEventsContent: "這段期間沒有符合的行程",
      eventClick: (info) => {
        const p = info.event.extendedProps;
        document.getElementById("mTitle").textContent = info.event.title;
        const tag = document.getElementById("mTag");
        tag.textContent = p.type;
        tag.style.background = info.event.backgroundColor;
        document.getElementById("mWhen").textContent = fmtRange(info.event);
        document.getElementById("mBody").textContent = p.detail || "（無其他說明）";
        document.getElementById("overlay").classList.add("show");
      },
    });
    refresh();
    calendar.render();
  })
  .catch((err) => {
    document.getElementById("calendar").innerHTML =
      '<p style="text-align:center;color:#c0392b">行事曆資料載入失敗，請重新整理。</p>';
    console.error(err);
  });

function addDays(iso, n) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function fmtRange(ev) {
  const opts = { month: "long", day: "numeric", weekday: "short" };
  const ds = ev.start.toLocaleDateString("zh-TW", opts);
  if (ev.allDay) {
    if (ev.end) {
      const endIncl = new Date(ev.end.getTime() - 86400000);
      if (endIncl > ev.start) return ds + " ～ " + endIncl.toLocaleDateString("zh-TW", opts);
    }
    return ds + "（全天）";
  }
  const t = (d) => d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  return ds + "　" + t(ev.start) + " ～ " + (ev.end ? t(ev.end) : "");
}
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") e.target.classList.remove("show");
});
</script>
</body>
</html>
